name: Property tests

# Hypothesis state-machine tests for the core invariants (ownership ledger, ...).
# A new, non-required check (per integration owner); mutmut runs on demand, not here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hypothesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - run: uv run python -m pytest tests/property -q
