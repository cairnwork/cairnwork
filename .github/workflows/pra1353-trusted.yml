# Runs from the default branch (pull_request_target), so a PR cannot edit, skip or swap it. The
# gate, its pins and its witness come from the trusted checkout; the PR head is a second checkout
# that is passed to the gate only as --source (its src is judged, nothing in it is installed or
# run by us). The analysis job has contents:read only and no secrets; the job that holds
# statuses:write never touches PR content and accepts one whitelisted value. Report-only: this
# context is not a required check. A same-repository PR can add its own workflow posting a fake
# status; that is addressed when the check is promoted.
name: pra1353-trusted

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

concurrency:
  group: pra1353-trusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trusted tree (default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: trusted
          persist-credentials: false
      - name: Validate pull request refs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "PR sha is not 40-hex"; exit 1; }
          [[ "$HEAD_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "bad PR repo"; exit 1; }
      - name: PR head (data only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.2"
          python-version: "3.13"
          enable-cache: false
      - name: Trusted venv from main's lock
        env:
          UV_NO_CONFIG: "1"
        run: |
          set -euo pipefail
          # Only main's lock is trusted; the empty private cache keeps earlier runs out.
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "the gate trusts only main's lock"; exit 1; }
          venvdir="$RUNNER_TEMP/pra1353-trusted"
          mkdir -p "$venvdir"
          cp trusted/uv.lock trusted/pyproject.toml "$venvdir/"
          cd "$venvdir"
          UV_PROJECT_ENVIRONMENT="$venvdir/.venv" uv sync --no-cache --locked --no-install-project
          "$venvdir/.venv/bin/python" -I -S -B "$GITHUB_WORKSPACE/trusted/tests/pra1353_base_record.py" \
            record "$RUNNER_TEMP/base-python.json"
      - name: Sealed #1353 witness gate on the PR source
        env:
          UV_NO_CONFIG: "1"
        run: |
          set -uo pipefail
          # The gate runs PR-controlled code: stop workflow commands (::, ##[) in its output.
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$token"
          py="$RUNNER_TEMP/pra1353-trusted/.venv/bin/python"
          rc=0
          cd trusted
          "$py" -I -S -B tests/pra1353_base_record.py verify "$RUNNER_TEMP/base-python.json" || rc=$?
          if [ "$rc" -eq 0 ]; then
            PRA1353_BASE_LOCK="$RUNNER_TEMP/pra1353-trusted/uv.lock" \
              setsid "$py" -I -S -B tests/pra1353_gate.py --source "$GITHUB_WORKSPACE/head" &
            pid=$!
            wait "$pid" || rc=$?
            # Nothing the gate started may outlive it before the result is written.
            kill -KILL -- "-$pid" 2>/dev/null || true
          fi
          mkdir -p "$RUNNER_TEMP/gate_rc"
          printf '%s' "$rc" > "$RUNNER_TEMP/gate_rc/gate_rc"
          echo "::$token::"
      - name: Save the gate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate_rc
          path: ${{ runner.temp }}/gate_rc/gate_rc
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: analyze
    if: always() && needs.analyze.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Trusted tree (default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the gate result
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gate_rc
          path: ${{ runner.temp }}/rc
      - name: Publish the status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RC_FILE: ${{ runner.temp }}/rc/gate_rc
        run: |
          python3 -I scripts/ci/pra1353_trusted_status.py \
            --rc-file "$RC_FILE" --repo "$REPO" --sha "$HEAD_SHA" --run-url "$RUN_URL"
