# Runs from the default branch (pull_request_target), so a PR cannot edit, skip or swap it. The
# gate, its pins and its witness come from the trusted checkout; the PR head is a second checkout
# that is passed to the gate only as --source (its src is judged, nothing in it is installed or
# run by us). The analysis job has contents:read only and no secrets; the job that holds
# statuses:write never touches PR content and accepts one whitelisted value. Report-only: this
# context is not a required check. A same-repository PR can add its own workflow posting a fake
# status; that is addressed when the check is promoted.
name: pra1353-trusted

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

concurrency:
  group: pra1353-trusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Trusted tree (default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: trusted
          persist-credentials: false
      - name: Validate pull request refs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "PR sha is not 40-hex"; exit 1; }
          [[ "$HEAD_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "bad PR repo"; exit 1; }
      - name: PR head (data only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.2"
          python-version: "3.13"
          enable-cache: false
      - name: Trusted venv and gate user (no PR code runs here)
        timeout-minutes: 10
        env:
          UV_NO_CONFIG: "1"
        run: |
          set -euo pipefail
          # Only main's lock is trusted; no uv cache is read or written.
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "the gate trusts only main's lock"; exit 1; }
          uv_bin="$(command -v uv)"
          root=/srv/pra1353
          sudo -n install -d -m 0755 "$root" "$root/lock"
          sudo -n useradd --system --no-create-home --home-dir "$root/home" \
            --shell /usr/sbin/nologin pra1353gate
          # The gate account must not be able to use sudo.
          if sudo -n -u pra1353gate sudo -n true 2>/dev/null; then echo "gate user has sudo"; exit 1; fi
          sudo -n install -d -m 0700 -o pra1353gate "$root/home" "$root/tmp"
          sudo -n cp trusted/uv.lock trusted/pyproject.toml "$root/lock/"
          sudo -n cp -a trusted "$root/trusted"
          sudo -n cp -a head "$root/head"
          sudo -n chown -R pra1353gate "$root/trusted" "$root/head"
          # The venv, its Python and the lock are root-owned and read-only for the gate account.
          cd "$root/lock"
          sudo -n env UV_NO_CONFIG=1 UV_PYTHON_INSTALL_DIR="$root/python" \
            UV_PROJECT_ENVIRONMENT="$root/venv" \
            "$uv_bin" sync --python 3.13 --managed-python --no-cache --locked --no-install-project
          sudo -n "$root/venv/bin/python" -I -S -B "$root/trusted/tests/pra1353_base_record.py" \
            record "$root/base-python.json"
      - name: Sealed #1353 witness gate on the PR source (separate account)
        timeout-minutes: 15
        run: |
          set -uo pipefail
          # The gate runs PR-controlled code: stop workflow commands (::, ##[) in its output.
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$token"
          root=/srv/pra1353
          py="$root/venv/bin/python"
          cd "$root/trusted"
          # Clean env: no runner token, cache or file-command variables reach the gate.
          run_gate() {
            sudo -n -u pra1353gate env -i PATH=/usr/bin:/bin HOME="$root/home" TMPDIR="$root/tmp" \
              LANG=C.UTF-8 PRA1353_BASE_LOCK="$root/lock/uv.lock" "$@"
          }
          rc=0
          run_gate "$py" -I -S -B tests/pra1353_base_record.py verify "$root/base-python.json" || rc=$?
          if [ "$rc" -eq 0 ]; then
            run_gate timeout -k 10 840 "$py" -I -S -B tests/pra1353_gate.py --source "$root/head" || rc=$?
          fi
          # Nothing the gate account started may outlive it before the result is written.
          sudo -n pkill -KILL -u pra1353gate || true
          mkdir -p "$RUNNER_TEMP/gate_rc"
          printf '%s' "$rc" > "$RUNNER_TEMP/gate_rc/gate_rc"
          echo "::$token::"
      - name: Save the gate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate_rc
          path: ${{ runner.temp }}/gate_rc/gate_rc
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: analyze
    if: always() && needs.analyze.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Trusted tree (default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the gate result
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gate_rc
          path: ${{ runner.temp }}/rc
      - name: Publish the status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RC_FILE: ${{ runner.temp }}/rc/gate_rc
        run: |
          python3 -I scripts/ci/pra1353_trusted_status.py \
            --rc-file "$RC_FILE" --repo "$REPO" --sha "$HEAD_SHA" --run-url "$RUN_URL"
