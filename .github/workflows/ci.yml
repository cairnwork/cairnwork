name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python scripts/check_size.py
      - run: uv run pytest -q
      - run: git diff --check

  # The exact-base Pyright gate runs from the default branch (pyright-trusted.yml, Issue #66):
  # a PR-owned job could be edited away, so it is not defined here.

  # The verifier sandbox (macOS Seatbelt) is only proven on macOS. Nexus-new's
  # sandbox could not run pytest for weeks because nothing ran it for real, so
  # this job cannot skip: a missing sandbox-exec fails it.
  test-macos:
    runs-on: macos-latest
    env:
      CAIRNWORK_REQUIRE_SANDBOX: "1"
      CAIRNWORK_REQUIRE_VERIFIER_ACCOUNT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed without sandbox-exec
        run: |
          test -x /usr/bin/sandbox-exec
          /usr/bin/sandbox-exec -p '(version 1) (allow default)' /usr/bin/true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Create the verifier account (Issue #9)
        run: |
          sudo zsh scripts/setup_verifier_user.sh "$USER"
          zsh scripts/setup_verifier_python.sh
      - run: uv run pytest -q

  # Linux bwrap backend, witnessed on real bwrap. On a GitHub ubuntu-24.04 runner an AppArmor
  # rule restricts capability-bearing user namespaces by default, so the job asserts available()
  # is False under the restriction and True once it is lifted, runs an unguarded namespace probe
  # (unguarded on purpose: a host that cannot nest namespaces reddens the leg rather than letting
  # the sandbox tests skip silently), then runs the sandbox witnesses under CAIRNWORK_REQUIRE_SANDBOX.
  test-linux-sandbox:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: The default AppArmor userns restriction must make the probe fail closed
        run: |
          uv run python -c "from cairnwork_sandbox import bwrap; assert bwrap.available() is False, 'restricted host must not be available'"
      - name: Lift the restriction (end users load an AppArmor profile instead)
        run: |
          # || true: an older kernel may lack this key. If the lift silently fails the next
          # step's assert that available() is True reddens with a clear message instead.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: The probe must pass once the restriction is lifted
        run: |
          uv run python -c "from cairnwork_sandbox import bwrap; assert bwrap.available() is True, 'lifted host must be available'"
      - name: Gate — bwrap must be able to nest namespaces (unguarded)
        run: bwrap --unshare-pid --unshare-user --cap-drop ALL --ro-bind / / --proc /proc true
      - name: Sandbox witnesses on real bwrap
        run: CAIRNWORK_REQUIRE_SANDBOX=1 uv run pytest -q tests/test_sandbox.py

  # Linux P4 (Issue #84): verifiers run as a dedicated unprivileged account, as on macOS.
  # Creates the account, then runs the account witnesses on real bwrap with the account
  # required — a missing or unusable account fails the job (it cannot silently skip).
  test-linux-verifier-account:
    runs-on: ubuntu-24.04
    env:
      CAIRNWORK_REQUIRE_SANDBOX: "1"
      CAIRNWORK_REQUIRE_VERIFIER_ACCOUNT: "1"
      CAIRNWORK_VERIFIER_ROOT: "/var/lib/cairnwork"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Install bubblewrap and zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap zsh
          bwrap --version
      - name: Lift the AppArmor userns restriction (end users load a profile instead)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Create the verifier account (Issue #84) and its Python
        run: |
          sudo sh scripts/setup_verifier_user_linux.sh "$USER"
          zsh scripts/setup_verifier_python.sh
      - name: Account witnesses on real bwrap, as the dedicated account
        run: uv run pytest -q -m verifier_account
      - name: Account run is membership-independent — cleared groups + umask 077 (Issue #108)
        # The owner↔account file sharing must not depend on the owner process being an effective
        # member of the shared `cairnwork` group. Drop all supplementary groups (setpriv needs root,
        # so via sudo, reusing the same uid/gid) and run the strict-umask account verify: the account
        # must still reach the checkout and run. PATH/HOME are passed through so uv and its cache work.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo setpriv --clear-groups --reuid "$(id -u)" --regid "$(id -g)" -- \
            env "PATH=$PATH" "HOME=$HOME" \
              CAIRNWORK_REQUIRE_SANDBOX=1 CAIRNWORK_REQUIRE_VERIFIER_ACCOUNT=1 \
              CAIRNWORK_VERIFIER_ROOT=/var/lib/cairnwork \
              bash -c 'umask 077 && id -nG && uv run pytest -q tests/test_verifier_account.py tests/test_checkout_write_parity.py -k "strict_caller_umask or (checkout_writes_match and account)"'

  # Launch witness (fe56's launch gate ③): the real one-line-install UX end to end on Linux.
  # The test/sandbox jobs run pytest, but nothing otherwise proves the *installed* console script
  # `cairnwork demo` reaches a Core VERIFIED verdict on Linux. This installs the tool the way an end
  # user does (uv tool install) and runs the demo on real bwrap, failing closed if the verdict is not
  # VERIFIED or if the sandbox was absent (a demo that ran without a backend is not a valid witness).
  # AppArmor's default userns restriction is lifted here exactly as an end user loads an AppArmor
  # profile. Advisory, not a required check.
  demo-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: Lift the AppArmor userns restriction (end users load a profile instead)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install the cairnwork tool the way an end user does
        run: |
          uv tool install --from . cairnwork
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: cairnwork demo must reach a Core VERIFIED verdict on real bwrap
        run: |
          set -o pipefail
          # `cairnwork demo` exits 0 only on a genuine VERIFIED verdict, and the engine records
          # VERIFIED only when a real sandbox backend ran the verifier (run_verifiers skips the run
          # and fails when no backend is available). So an exit 0 here already means the demo was
          # sandbox-backed: if the AppArmor lift above had silently failed, the demo would exit 1
          # and pipefail would redden this step. The grep is a second check on the printed verdict.
          cairnwork demo | tee demo.log
          grep -q 'core status:  VERIFIED' demo.log
