name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older runs, and a new push to main
# cancels main's older runs, so the few macOS runners are not spent on superseded heads. Each main
# commit contains the ones before it, so a run of the newest main commit tests every merged change.
# GitHub does not guarantee the order in which runs enter a group: if an older main push enters
# last it cancels the newer run, so the newest main commit can be left without a completed run.
# Nothing re-runs it automatically; a cancelled run can be re-run by hand. PR heads are always
# tested before they land, unaffected by this.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'nightly') || (github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.ref)) || 'main' }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a hung job must not hold a runner for the 6 h GitHub default (#1499)
    # Issue #1696: a pull request runs the whole suite on the minimum Python (3.11) only; the other
    # two legs keep their names (test (3.12), test (3.13): required checks, no ruleset change) and
    # pass at once. A push to main, the nightly and a manual run on main run all three versions;
    # only a red nightly or a red manual run on main opens or updates an Issue (linux-nightly-report);
    # a red push to main shows as a red check on that commit.
    env:
      FULL_SUITE: ${{ matrix.python-version == '3.11' || github.event_name != 'pull_request' }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.FULL_SUITE == 'true'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: env.FULL_SUITE == 'true'
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      # #1454 B2: the gate runs before any PR-controlled code (the PR's uv sync and its build hook,
      # scripts/*), from a venv synced from the BASE sha's uv.lock and pyproject.toml without the
      # project, in a directory outside the checkout. The gate checks that venv against that lock.
      - name: Trusted #1353 gate venv from the base lock
        if: env.FULL_SUITE == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A PR picks its own base branch and this workflow does not rerun when the base changes,
          # so only main's lock is trusted. The private, empty uv cache keeps a cache that an
          # earlier run's PR code could have written out of the trusted venv.
          case "$EVENT:$BASE_REF:$GITHUB_REF" in
            pull_request:main:* | push::refs/heads/main | schedule::refs/heads/main | workflow_dispatch::refs/heads/main) ;;
            *) echo "the #1353 gate trusts only main's lock"; exit 1 ;;
          esac
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "base sha is not 40-hex"; exit 1; }
          git fetch --no-tags --depth=1 origin -- "$BASE_SHA"
          trusted="$RUNNER_TEMP/pra1353-trusted"
          mkdir -p "$trusted"
          git cat-file blob "${BASE_SHA}:uv.lock" > "$trusted/uv.lock"
          git cat-file blob "${BASE_SHA}:pyproject.toml" > "$trusted/pyproject.toml"
          cd "$trusted"
          UV_PROJECT_ENVIRONMENT="$trusted/.venv" uv sync --no-cache --locked --no-install-project
          # #1450: the base Python install this venv stands on, recorded before any PR code runs
          # (only the recorder itself, which the gate step's check below re-reads against it)
          "$trusted/.venv/bin/python" -I -S -B "$GITHUB_WORKSPACE/tests/pra1353_base_record.py" \
            record "$RUNNER_TEMP/base-python.json"
      - name: Sealed #1353 witness gate
        if: env.FULL_SUITE == 'true'
        run: |
          set -euo pipefail
          # The gate runs PR-controlled code: stop workflow commands (::, ##[) in its output.
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$token"
          rc=0
          "$RUNNER_TEMP/pra1353-trusted/.venv/bin/python" -I -S -B tests/pra1353_base_record.py \
            verify "$RUNNER_TEMP/base-python.json" || rc=$?
          [ "$rc" -eq 0 ] && PRA1353_BASE_LOCK="$RUNNER_TEMP/pra1353-trusted/uv.lock" \
            "$RUNNER_TEMP/pra1353-trusted/.venv/bin/python" -I -S -B tests/pra1353_gate.py || rc=$?
          echo "::$token::"
          exit "$rc"
      - if: env.FULL_SUITE == 'true'
        run: uv sync --locked
      - if: env.FULL_SUITE == 'true'
        run: uv run ruff check .
      - if: env.FULL_SUITE == 'true'
        run: uv run ruff format --check .
      - if: env.FULL_SUITE == 'true'
        run: uv run lint-imports
      - if: env.FULL_SUITE == 'true'
        run: uv run python scripts/check_size.py
      - if: env.FULL_SUITE == 'true'
        run: uv run pytest -q --ignore=tests/test_1039_1353_witnesses.py
      - if: env.FULL_SUITE == 'true'
        run: git diff --check
      - name: Leg skipped on pull requests (Issue #1696)
        if: env.FULL_SUITE != 'true'
        run: echo "the full suite runs on Python 3.11 for pull requests; this version runs nightly"

  # A red full Linux run (the nightly, or a manual run on main) opens or updates one Issue.
  linux-nightly-report:
    name: open or update the Linux nightly Issue
    needs: test
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && needs.test.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the "Linux nightly failed" Issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          body="$(printf 'The full Linux suite on all Python versions (%s run) finished %s.\n\nRun: %s\n' "$EVENT" "$RESULT" "$RUN_URL")"
          n="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --search 'Linux nightly failed in:title' --json number,title \
            --jq '[.[] | select(.title == "Linux nightly failed")][0].number // empty' || true)"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "Linux nightly failed" --body "$body"
          fi

  # The exact-base Pyright gate runs from the default branch (pyright-trusted.yml, Issue #66):
  # a PR-owned job could be edited away, so it is not defined here.

  # The verifier sandbox (macOS Seatbelt) is only proven on macOS. Nexus-new's
  # sandbox could not run pytest for weeks because nothing ran it for real, so
  # this job cannot skip: a missing sandbox-exec fails it.
  # The macOS suite is two parallel shards balanced by measured file cost (scripts/ci_macos_shard.py,
  # scripts/ci_macos_weights.json); the sealed #1353 gate runs on shard 1, the serial verifier-account
  # tests on shard 2. The job below named test-macos stays the required check: it passes only when
  # every shard passed.
  # On a pull request the shards run only the platform-specific test files (Issue #1684,
  # scripts/ci_macos_platform.py; the Linux jobs run everything else); the schedule and a manual
  # dispatch run the whole suite, and a red one opens or updates an Issue (macos-nightly-report).
  # tests/test_ci_macos_platform_guard.py pins this wiring and the selection. Check names unchanged.
  test-macos-shard:
    name: test-macos-shard (${{ matrix.shard }})
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2"]
    runs-on: macos-latest
    timeout-minutes: 120  # a hung job must not hold a runner for the 6 h GitHub default (#1499)
    env:
      CAIRNWORK_REQUIRE_SANDBOX: "1"
      CAIRNWORK_REQUIRE_VERIFIER_ACCOUNT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail closed without sandbox-exec
        run: |
          test -x /usr/bin/sandbox-exec
          /usr/bin/sandbox-exec -p '(version 1) (allow default)' /usr/bin/true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: false
      # #1454 B2: the gate runs before any PR-controlled code (the PR's uv sync and its build hook,
      # scripts/*), from a venv synced from the BASE sha's uv.lock and pyproject.toml without the
      # project, in a directory outside the checkout. The gate checks that venv against that lock.
      - name: Trusted #1353 gate venv from the base lock
        if: matrix.shard == '1'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A PR picks its own base branch and this workflow does not rerun when the base changes,
          # so only main's lock is trusted. The private, empty uv cache keeps a cache that an
          # earlier run's PR code could have written out of the trusted venv.
          case "$EVENT:$BASE_REF:$GITHUB_REF" in
            pull_request:main:* | push::refs/heads/main | schedule::refs/heads/main | workflow_dispatch::refs/heads/main) ;;
            *) echo "the #1353 gate trusts only main's lock"; exit 1 ;;
          esac
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "base sha is not 40-hex"; exit 1; }
          git fetch --no-tags --depth=1 origin -- "$BASE_SHA"
          trusted="$RUNNER_TEMP/pra1353-trusted"
          mkdir -p "$trusted"
          git cat-file blob "${BASE_SHA}:uv.lock" > "$trusted/uv.lock"
          git cat-file blob "${BASE_SHA}:pyproject.toml" > "$trusted/pyproject.toml"
          cd "$trusted"
          UV_PROJECT_ENVIRONMENT="$trusted/.venv" uv sync --no-cache --locked --no-install-project
          # #1450: the base Python install this venv stands on, recorded before any PR code runs
          # (only the recorder itself, which the gate step's check below re-reads against it)
          "$trusted/.venv/bin/python" -I -S -B "$GITHUB_WORKSPACE/tests/pra1353_base_record.py" \
            record "$RUNNER_TEMP/base-python.json"
      - name: Sealed #1353 witness gate
        if: matrix.shard == '1'
        run: |
          set -euo pipefail
          # The gate runs PR-controlled code: stop workflow commands (::, ##[) in its output.
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$token"
          rc=0
          "$RUNNER_TEMP/pra1353-trusted/.venv/bin/python" -I -S -B tests/pra1353_base_record.py \
            verify "$RUNNER_TEMP/base-python.json" || rc=$?
          [ "$rc" -eq 0 ] && PRA1353_BASE_LOCK="$RUNNER_TEMP/pra1353-trusted/uv.lock" \
            "$RUNNER_TEMP/pra1353-trusted/.venv/bin/python" -I -S -B tests/pra1353_gate.py || rc=$?
          echo "::$token::"
          exit "$rc"
      - run: uv sync --locked
      - name: Create the verifier account (Issue #9)
        run: |
          sudo zsh scripts/setup_verifier_user.sh "$USER"
          zsh scripts/setup_verifier_python.sh
      # #406 step 4: everything except the shared verifier account runs in parallel; files that
      # share state are pinned to one worker by their xdist_group mark (tests/xdist_groups.py).
      - name: Tests of this shard
        id: shard_tests
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Only a pull request gets the platform-specific subset (Issue #1684); every other event
          # (schedule, workflow_dispatch) runs the whole suite, so an unknown event fails closed.
          mode=()
          [ "$EVENT" = "pull_request" ] && mode=(--platform-only)
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(uv run python scripts/ci_macos_shard.py "${{ matrix.shard }}" ${mode[@]+"${mode[@]}"})
          # an empty list would make pytest run the whole tree (and the witness file)
          [ "${#files[@]}" -gt 0 ] || { echo "no test files for shard ${{ matrix.shard }}"; exit 1; }
          uv run pytest -q -o faulthandler_timeout=1200 -o junit_family=xunit1 \
            --junitxml="$RUNNER_TEMP/macos-shard-${{ matrix.shard }}.xml" \
            -n auto --dist loadgroup -m "not verifier_account" "${files[@]}"
      # The verifier account is one shared account: its tests stay serial, in shard 2 (the
      # marker selects them across the whole tree, whichever shard their file belongs to).
      - name: Verifier-account tests
        if: matrix.shard == '2'
        run: |
          uv run pytest -q -o faulthandler_timeout=1200 -o junit_family=xunit1 \
            --junitxml="$RUNNER_TEMP/macos-verifier.xml" \
            -m verifier_account --ignore=tests/test_1039_1353_witnesses.py
      # The time of every test file of this shard, for the job summary (not a check: never fails).
      - name: Per-file time in the job summary
        if: ${{ (success() || failure()) && steps.shard_tests.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          for xml in "$RUNNER_TEMP"/macos-*.xml; do
            [ -f "$xml" ] || continue
            python3 -I scripts/ci_junit_summary.py "$xml" "macOS shard ${{ matrix.shard }}: $(basename "$xml")" 80 >> "$GITHUB_STEP_SUMMARY"
          done

  # The required check keeps its name: green only when both shards are green.
  test-macos:
    needs: test-macos-shard
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: All macOS shards passed
        env:
          RESULT: ${{ needs.test-macos-shard.result }}
        run: test "$RESULT" = success

  # A red full macOS run (nightly or manual dispatch) must not be silent (Issue #1684): one open
  # Issue "macOS nightly failed" gets a comment per red run; a failed lookup still files an Issue.
  macos-nightly-report:
    name: open or update the macOS nightly Issue
    needs: test-macos-shard
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && needs.test-macos-shard.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the "macOS nightly failed" Issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          RESULT: ${{ needs.test-macos-shard.result }}
        run: |
          set -euo pipefail
          body="$(printf 'The full macOS suite (%s run) finished %s.\n\nRun: %s\n' "$EVENT" "$RESULT" "$RUN_URL")"
          n="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --search 'macOS nightly failed in:title' --json number,title \
            --jq '[.[] | select(.title == "macOS nightly failed")][0].number // empty' || true)"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "macOS nightly failed" --body "$body"
          fi

  # Linux bwrap backend, witnessed on real bwrap. On a GitHub ubuntu-24.04 runner an AppArmor
  # rule restricts capability-bearing user namespaces by default, so the job asserts available()
  # is False under the restriction and True once it is lifted, runs an unguarded namespace probe
  # (unguarded on purpose: a host that cannot nest namespaces reddens the leg rather than letting
  # the sandbox tests skip silently), then runs the sandbox witnesses under CAIRNWORK_REQUIRE_SANDBOX.
  test-linux-sandbox:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30  # a hung job must not hold a runner for the 6 h GitHub default (#1499)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: The default AppArmor userns restriction must make the probe fail closed
        run: |
          uv run python -c "from cairnwork_sandbox import bwrap; assert bwrap.available() is False, 'restricted host must not be available'"
      - name: Lift the restriction (end users load an AppArmor profile instead)
        run: |
          # || true: an older kernel may lack this key. If the lift silently fails the next
          # step's assert that available() is True reddens with a clear message instead.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: The probe must pass once the restriction is lifted
        run: |
          uv run python -c "from cairnwork_sandbox import bwrap; assert bwrap.available() is True, 'lifted host must be available'"
      - name: Gate — bwrap must be able to nest namespaces (unguarded)
        run: bwrap --unshare-pid --unshare-user --cap-drop ALL --ro-bind / / --proc /proc true
      - name: Sandbox witnesses on real bwrap
        run: CAIRNWORK_REQUIRE_SANDBOX=1 uv run pytest -q tests/test_sandbox.py tests/test_bwrap_symlink_masks.py tests/test_bwrap_mask_roots.py tests/test_run_isolation_witness.py tests/test_tmp_isolation_witness.py tests/test_bwrap_inner_links.py tests/test_bwrap_link_real_423.py tests/test_pycache_redirect_spellings.py tests/test_pycache_redirect.py tests/test_bytecode_hook_proc_mem.py tests/test_denial_errno_sandbox.py tests/test_wrapped_dns_env.py tests/test_bwrap_482_real.py tests/test_bwrap_471_locations_real.py

  # Informational probe (#1492): the tests marked `sandbox` run on real bwrap with the sandbox
  # required, to measure which of them need macOS and how long each file takes. It is not a
  # required check and cannot fail the PR (continue-on-error on the test step); the result is in
  # the job summary. Like test-linux-sandbox and test-linux-verifier-account it does not run the
  # #1353 gate (the gate is on `test` and on macOS shard 1): a pull_request job with read-only
  # permissions and no secrets, and not a required check.
  test-linux-sandbox-probe:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CAIRNWORK_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Lift the AppArmor userns restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Tests marked sandbox on real bwrap (informational)
        id: probe_tests
        continue-on-error: true
        run: |
          uv run pytest -q -o faulthandler_timeout=1200 -o junit_family=xunit1 \
            --junitxml="$RUNNER_TEMP/probe.xml" -n auto --dist loadgroup \
            -m "sandbox and not verifier_account" --ignore=tests/test_1039_1353_witnesses.py
      - name: Per-file result and time in the job summary
        if: ${{ (success() || failure()) && steps.probe_tests.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          python3 -I scripts/ci_junit_summary.py "$RUNNER_TEMP/probe.xml" \
            "bwrap probe: tests marked sandbox, CAIRNWORK_REQUIRE_SANDBOX=1" 200 >> "$GITHUB_STEP_SUMMARY"

  # Linux P4 (Issue #84): verifiers run as a dedicated unprivileged account, as on macOS.
  # Creates the account, then runs the account witnesses on real bwrap with the account
  # required — a missing or unusable account fails the job (it cannot silently skip).
  test-linux-verifier-account:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # a hung job must not hold a runner for the 6 h GitHub default (#1499)
    env:
      CAIRNWORK_REQUIRE_SANDBOX: "1"
      CAIRNWORK_REQUIRE_VERIFIER_ACCOUNT: "1"
      CAIRNWORK_VERIFIER_ROOT: "/var/lib/cairnwork"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked
      - name: Install bubblewrap and zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap zsh
          bwrap --version
      - name: Lift the AppArmor userns restriction (end users load a profile instead)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Create the verifier account (Issue #84) and its Python
        run: |
          sudo sh scripts/setup_verifier_user_linux.sh "$USER"
          zsh scripts/setup_verifier_python.sh
      - name: Account witnesses on real bwrap, as the dedicated account
        run: uv run pytest -q -m verifier_account
      - name: Account run is membership-independent — cleared groups + umask 077 (Issue #108)
        # The owner↔account file sharing must not depend on the owner process being an effective
        # member of the shared `cairnwork` group. Drop all supplementary groups (setpriv needs root,
        # so via sudo, reusing the same uid/gid) and run the strict-umask account verify: the account
        # must still reach the checkout and run. PATH/HOME are passed through so uv and its cache work.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo setpriv --clear-groups --reuid "$(id -u)" --regid "$(id -g)" -- \
            env "PATH=$PATH" "HOME=$HOME" \
              CAIRNWORK_REQUIRE_SANDBOX=1 CAIRNWORK_REQUIRE_VERIFIER_ACCOUNT=1 \
              CAIRNWORK_VERIFIER_ROOT=/var/lib/cairnwork \
              bash -c 'umask 077 && id -nG && uv run pytest -q tests/test_verifier_account.py tests/test_checkout_write_parity.py -k "strict_caller_umask or (checkout_writes_match and account)"'

  # Launch witness (fe56's launch gate ③): the real one-line-install UX end to end on Linux.
  # The test/sandbox jobs run pytest, but nothing otherwise proves the *installed* console script
  # `cairnwork demo` reaches a Core VERIFIED verdict on Linux. This installs the tool the way an end
  # user does (uv tool install) and runs the demo on real bwrap, failing closed if the verdict is not
  # VERIFIED or if the sandbox was absent (a demo that ran without a backend is not a valid witness).
  # AppArmor's default userns restriction is lifted here exactly as an end user loads an AppArmor
  # profile. Advisory, not a required check.
  demo-linux:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # a hung job must not hold a runner for the 6 h GitHub default (#1499)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: Lift the AppArmor userns restriction (end users load a profile instead)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install the cairnwork tool the way an end user does
        run: |
          uv tool install --from . cairnwork
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: cairnwork demo must reach a Core VERIFIED verdict on real bwrap
        run: |
          set -o pipefail
          # `cairnwork demo` exits 0 only on a genuine VERIFIED verdict, and the engine records
          # VERIFIED only when a real sandbox backend ran the verifier (run_verifiers skips the run
          # and fails when no backend is available). So an exit 0 here already means the demo was
          # sandbox-backed: if the AppArmor lift above had silently failed, the demo would exit 1
          # and pipefail would redden this step. The grep is a second check on the printed verdict.
          cairnwork demo | tee demo.log
          grep -q 'core status:  VERIFIED' demo.log
