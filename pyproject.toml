[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cairnwork"
version = "0.0.1.dev0"
description = "Cairnwork: governed agent task core (successor to Nexus-new)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44.0.1",
    "nexus-certify",
]

[project.scripts]
cairnwork = "cairnwork_quickstart.cli:main"
cairnwork-route = "cairnwork.route:main"
cairnwork-issues = "cairnwork.issue_runner:main"
cairnwork-verify = "cairnwork.verify_cli:main"
cairnwork-attest = "cairnwork_attest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "import-linter>=2.1",
    "hypothesis>=6.100",
    "pytest-xdist>=3.6",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/cairnwork",
    "src/cairnwork_protocol",
    "src/cairnwork_sandbox",
    "src/cairnwork_quickstart",
    "src/cairnwork_attest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "sandbox: needs real macOS sandbox-exec (skipped elsewhere unless required)",
    "verifier_account: needs the dedicated verifier account (scripts/setup_verifier_user.sh)",
    "no_origin_patch: sees the real DEFAULT_CONFIG require_base_on_main (no autouse override)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "S110", "S112", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.importlinter]
root_packages = [
    "cairnwork",
    "cairnwork_protocol",
    "cairnwork_sandbox",
    "cairnwork_quickstart",
    "cairnwork_attest",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core must not import experimental"
type = "forbidden"
source_modules = ["cairnwork"]
forbidden_modules = ["experimental"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Quickstart depends on the core, never the other way"
type = "forbidden"
source_modules = ["cairnwork"]
forbidden_modules = ["cairnwork_quickstart"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Core never imports attest (attest reads the core's outputs, one-way)"
type = "forbidden"
source_modules = ["cairnwork"]
forbidden_modules = ["cairnwork_attest"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "The protocol package stands alone (no Core code, no Cairnwork core)"
type = "forbidden"
source_modules = ["cairnwork_protocol"]
forbidden_modules = ["product", "cairnwork", "cairnwork_quickstart"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "The sandbox package stands alone (only the core calls it, never the other way)"
type = "forbidden"
source_modules = ["cairnwork_sandbox"]
forbidden_modules = ["cairnwork", "product", "experimental", "cairnwork_quickstart"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "No import cycles between cairnwork modules"
type = "acyclic_siblings"
ancestors = ["cairnwork"]

[tool.uv.sources]
nexus-certify = { git = "https://github.com/James3014/nexus-core.git", rev = "b07ae36d64501af761e8f2069830b79f89ac733b" }
